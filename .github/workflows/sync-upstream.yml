name: Sincronizar con el origen

# Trae a este espejo lo que publique el repositorio original. Es aditivo a
# propósito: si el original borra ficheros, aquí se restauran, porque el motivo
# de existir de este espejo es conservar el archivo histórico pase lo que pase.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fusionar los cambios del origen
        id: merge
        env:
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/liturgiadelashoras/liturgiadelashoras.github.io.git
          git fetch --quiet upstream

          RAMA_ORIGEN="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          ANTES="$(git rev-parse HEAD)"
          git merge --no-edit "upstream/$RAMA_ORIGEN"
          DESPUES="$(git rev-parse HEAD)"

          if [ "$ANTES" = "$DESPUES" ]; then
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            echo "Sin novedades en el origen."
            exit 0
          fi

          # Salvaguarda: reponer lo que el origen haya eliminado.
          git diff --diff-filter=D --name-only "$ANTES" "$DESPUES" > /tmp/borrados.txt
          if [ -s /tmp/borrados.txt ]; then
            N="$(wc -l < /tmp/borrados.txt)"
            echo "El origen eliminó $N fichero(s); se restauran."
            xargs -a /tmp/borrados.txt -d '\n' git checkout "$ANTES" --
            git commit -m "Conservar $N fichero(s) que el origen eliminó"
            echo "restaurados=$N" >> "$GITHUB_OUTPUT"
          fi

          echo "cambios=si" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$RAMA"

      - name: Avisar de ficheros restaurados
        if: steps.merge.outputs.restaurados != ''
        uses: actions/github-script@v7
        with:
          script: |
            const n = '${{ steps.merge.outputs.restaurados }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `El origen eliminó ${n} fichero(s)`,
              body: [
                `La sincronización detectó que el repositorio original eliminó ${n} fichero(s).`,
                '',
                'Se han restaurado automáticamente en este espejo. Merece la pena revisar',
                'si fue una limpieza deliberada del autor o un accidente.',
                '',
                `Ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });

      - name: Avisar si la sincronización falló
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Falló la sincronización con el origen',
              body: [
                'La sincronización diaria no pudo completarse. Lo más probable es un',
                'conflicto de fusión, que habría que resolver a mano.',
                '',
                'Mientras tanto el espejo sigue sirviendo el contenido que ya tenía.',
                '',
                `Ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
